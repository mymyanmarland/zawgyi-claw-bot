<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29"/>
      <stop offset="0.5" stop-color="#302b63"/>
      <stop offset="1" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <style>
      .float1 { animation: float1 7s ease-in-out infinite; }
      .float2 { animation: float2 9s ease-in-out infinite; }
      .float3 { animation: float3 11s ease-in-out infinite; }
      @keyframes float1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-22px); } }
      @keyframes float2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(18px); } }
      @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(14px,-16px); } }
      .twinkle { animation: twinkle 2.8s ease-in-out infinite; }
      .twinkle2 { animation: twinkle 3.7s ease-in-out infinite 1.2s; }
      .twinkle3 { animation: twinkle 4.5s ease-in-out infinite 0.6s; }
      @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 1; } }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
      .typing { font-family: 'Courier New', monospace; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }
      .rise { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
      .rise2 { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) 0.25s both; }
      .rise3 { animation: rise 1.1s cubic-bezier(.2,.8,.2,1) 0.5s both; }
      @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
      .spin { animation: spin 24s linear infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>

  <!-- ambient glows -->
  <ellipse class="float1" cx="250" cy="120" rx="260" ry="150" fill="url(#glow1)"/>
  <ellipse class="float2" cx="950" cy="300" rx="280" ry="160" fill="url(#glow2)"/>
  <ellipse class="float3" cx="620" cy="200" rx="180" ry="120" fill="url(#glow1)" opacity="0.5"/>

  <!-- stars -->
  <g fill="#fff">
    <circle class="twinkle" cx="80" cy="60" r="2.5"/>
    <circle class="twinkle2" cx="180" cy="330" r="2"/>
    <circle class="twinkle3" cx="340" cy="80" r="3"/>
    <circle class="twinkle" cx="520" cy="350" r="2"/>
    <circle class="twinkle2" cx="700" cy="70" r="2.5"/>
    <circle class="twinkle3" cx="880" cy="120" r="2"/>
    <circle class="twinkle" cx="1050" cy="70" r="3"/>
    <circle class="twinkle2" cx="1130" cy="330" r="2.5"/>
    <circle class="twinkle3" cx="960" cy="360" r="2"/>
    <circle class="twinkle" cx="420" cy="380" r="2"/>
    <circle class="twinkle2" cx="60" cy="220" r="2"/>
    <circle class="twinkle3" cx="1150" cy="200" r="2.5"/>
  </g>

  <!-- floating wizard -->
  <g class="float1">
    <text x="600" y="150" text-anchor="middle" font-size="96">🧙‍♂️</text>
  </g>

  <!-- orbiting ring -->
  <g class="spin" opacity="0.55">
    <ellipse cx="600" cy="115" rx="150" ry="46" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="10 8"/>
    <circle cx="750" cy="115" r="7" fill="#67e8f9"/>
    <circle cx="450" cy="115" r="5" fill="#f0abfc"/>
  </g>

  <!-- title -->
  <text class="rise" x="600" y="248" text-anchor="middle" font-size="64" font-weight="800" fill="url(#titleGrad)" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2">Zaw Gyi Claw Bot</text>

  <!-- burmese subtitle -->
  <text class="rise2" x="600" y="292" text-anchor="middle" font-size="26" fill="#e2e8f0" font-family="system-ui, sans-serif">မြန်မာလို ပြောတဲ့ ကိုယ်ပိုင် AI Assistant</text>

  <!-- typing line -->
  <g class="rise3">
    <rect x="330" y="312" width="540" height="52" rx="26" fill="#000" opacity="0.45"/>
    <rect x="330" y="312" width="540" height="52" rx="26" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.7"/>
    <text class="typing" x="360" y="346" font-size="21" fill="#a5f3fc">&gt; မင်္ဂလာပါ! ဘာကူညီပေးရမလဲ<span class="cursor" fill="#f0abfc">▌</span></text>
  </g>

  <!-- live badge -->
  <g class="pulse">
    <rect x="1030" y="28" width="140" height="40" rx="20" fill="#16a34a" opacity="0.9"/>
    <circle cx="1052" cy="48" r="7" fill="#fff"/>
    <text x="1098" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="#fff" font-family="system-ui, sans-serif">LIVE</text>
  </g>
</svg>
