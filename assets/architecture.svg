<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#131a3a"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="toolGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <style>
      .dashflow { stroke-dasharray: 8 8; animation: dashmove 1.4s linear infinite; }
      @keyframes dashmove { to { stroke-dashoffset: -32; } }
      .nodepulse { animation: nodepulse 2.6s ease-in-out infinite; }
      @keyframes nodepulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
      .bob { animation: bob 4s ease-in-out infinite; }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#abg)"/>
  <text x="600" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#e2e8f0" font-family="system-ui, sans-serif">⚙️ How it works</text>

  <!-- nodes -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <!-- user -->
    <g class="bob">
      <rect x="60" y="120" width="180" height="110" rx="18" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <text x="150" y="165" font-size="40">📱</text>
      <text x="150" y="200" font-size="18" font-weight="700" fill="#fde68a">You (Telegram)</text>
    </g>
    <!-- bot -->
    <g class="bob" style="animation-delay:0.6s">
      <rect x="330" y="120" width="180" height="110" rx="18" fill="url(#nodeGrad)" stroke="#c084fc" stroke-width="2" class="nodepulse"/>
      <text x="420" y="165" font-size="40">🧙‍♂️</text>
      <text x="420" y="200" font-size="18" font-weight="700" fill="#fff">Zaw Gyi Bot</text>
    </g>
    <!-- agent -->
    <g class="bob" style="animation-delay:1.2s">
      <rect x="600" y="120" width="180" height="110" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
      <text x="690" y="165" font-size="40">🧠</text>
      <text x="690" y="200" font-size="18" font-weight="700" fill="#ddd6fe">Agent Loop</text>
    </g>
    <!-- your api -->
    <g class="bob" style="animation-delay:1.8s">
      <rect x="870" y="120" width="180" height="110" rx="18" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
      <text x="960" y="165" font-size="40">🔑</text>
      <text x="960" y="200" font-size="18" font-weight="700" fill="#a5f3fc">Your Model API</text>
    </g>

    <!-- arrows -->
    <line class="dashflow" x1="240" y1="175" x2="330" y2="175" stroke="#f59e0b" stroke-width="2.5"/>
    <line class="dashflow" x1="510" y1="175" x2="600" y2="175" stroke="#a855f7" stroke-width="2.5"/>
    <line class="dashflow" x1="780" y1="175" x2="870" y2="175" stroke="#22d3ee" stroke-width="2.5"/>

    <!-- tools row -->
    <g>
      <rect x="330" y="270" width="180" height="56" rx="14" fill="url(#toolGrad)" opacity="0.9"/>
      <text x="420" y="305" font-size="17" font-weight="700" fill="#fff">🔍 web_search</text>
      <rect x="530" y="270" width="150" height="56" rx="14" fill="url(#toolGrad)" opacity="0.9"/>
      <text x="605" y="305" font-size="17" font-weight="700" fill="#fff">🕐 get_time</text>
      <rect x="700" y="270" width="170" height="56" rx="14" fill="url(#toolGrad)" opacity="0.9"/>
      <text x="785" y="305" font-size="17" font-weight="700" fill="#fff">🧠 memory</text>
      <rect x="890" y="270" width="170" height="56" rx="14" fill="url(#toolGrad)" opacity="0.9"/>
      <text x="975" y="305" font-size="17" font-weight="700" fill="#fff">⏰ reminders</text>
    </g>
    <line class="dashflow" x1="690" y1="230" x2="690" y2="270" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="305" font-size="15" fill="#94a3b8">BYO API key 🔐</text>
    <text x="150" y="326" font-size="15" fill="#94a3b8">AES-256 encrypted</text>
  </g>
</svg>
